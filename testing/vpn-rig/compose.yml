# The rig's servers. run.sh starts the ones a client needs; clients are
# plain `docker run`s on the same network (see there). The network is "the
# LAN" every client shares, so every location the rig produces is
# "<this bridge> via <tunnel>".
name: octomon-rig

networks:
  lan:
    name: octomon-rig
    # Fixed so the GRE peers can name each other; run.sh creates the network
    # with the same subnet when a client runs without servers.
    ipam:
      config: [{subnet: 172.30.0.0/24}]

services:
  wg-server:
    build: servers/wireguard
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks: [lan]

  ovpn-server:
    build: servers/openvpn
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: 1
    networks: [lan]

  gre-server:
    build: servers/gre
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      lan:
        ipv4_address: 172.30.0.250
