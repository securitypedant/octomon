# Test fixture: the rig's first OpenVPN server, pool 10.8.0.0/24.
# The certificates beside it are checked in on purpose (see README).
port 1194
proto udp
dev tun0
topology subnet
server 10.8.0.0 255.255.255.0
push "redirect-gateway def1"
ca ca.crt
cert server.crt
key server.key
dh none
keepalive 10 60
persist-key
persist-tun
explicit-exit-notify 1
verb 3
