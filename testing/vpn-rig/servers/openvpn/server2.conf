# Test fixture: the rig's second OpenVPN server, pool 10.9.0.0/24. A client
# that "reconnects" lands here, on a different server with a different
# address, and must still be one location.
port 1195
proto udp
dev tun1
topology subnet
server 10.9.0.0 255.255.255.0
push "redirect-gateway def1"
ca ca.crt
cert server.crt
key server.key
dh none
keepalive 10 60
persist-key
persist-tun
explicit-exit-notify 1
verb 3
