name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories land against dependencies that have not changed, so the audit
  # cannot only run when something is pushed. Weekly, on main.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

# Read-only token throughout. The matrix compiles every crate in Cargo.lock —
# their build scripts and proc macros run on this runner — and the repository
# default grants a write token, which a hijacked dependency could use to
# replace release assets. Nothing here writes to the repository: artifacts and
# the cache work with read access.
permissions:
  contents: read

# A newer push to the same branch supersedes a run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Website, README and brand art cannot affect a binary, and compiling five
  # platforms to prove it costs about twelve minutes of runner time — most of
  # it the Windows ARM leg, which installs LLVM before it can start. So the
  # expensive jobs ask this one first.
  #
  # `paths-ignore` on the trigger would be the obvious way and is the wrong
  # one: a workflow skipped that way never reports its checks, and the branch
  # protection rule requires `fmt · clippy · build · test`, so a website-only
  # pull request would sit unmergeable with nothing to explain why. Gating the
  # jobs instead keeps that check reporting on every run.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      worker: ${{ steps.filter.outputs.worker }}
      dist: ${{ steps.filter.outputs.dist }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Does anything that compiles differ?
        id: filter
        env:
          # `before` on a push, the merge base on a pull request.
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          decide() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "→ code=$1: $2"; }
          # The Worker and the dist check have their own, cheaper jobs; they
          # run when their files moved, or when nothing can be diffed.
          also() { echo "worker=$1" >> "$GITHUB_OUTPUT"; echo "dist=$2" >> "$GITHUB_OUTPUT"; echo "→ worker=$1 dist=$2"; }

          # The weekly run exists for the audit alone.
          if [ "$EVENT" = "schedule" ]; then
            decide false "scheduled audit"
            also false false
            exit 0
          fi

          base="${BASE:-$BEFORE}"
          # A new branch, a force-push, or any base we cannot resolve: build,
          # because guessing wrong in that direction is the cheap mistake.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            decide true "no usable base to diff against (${base:-none})"
            also true true
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$HEAD")
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          # Everything that cannot reach a compiler. No markdown is pulled in
          # with include_str!, so documentation really is inert; add future
          # web-only trees (a blog, say) here rather than to the trigger. The
          # Worker is inert to the Rust build too: it has its own job below.
          inert='^(website/|worker/|octomon-brand/|packaging/|\.github/ISSUE_TEMPLATE/|screenshot\.png$|LICENSE|.*\.md$)'
          if [ -z "$changed" ]; then
            decide true "empty diff — not trusting it"
            also true true
            exit 0
          elif echo "$changed" | grep -qvE "$inert"; then
            decide true "something outside the web/docs set changed"
          else
            decide false "web, docs and art only — nothing to compile"
          fi
          worker=false; dist=false
          echo "$changed" | grep -qE '^worker/' && worker=true
          # release.yml is generated from dist-workspace.toml; a change to
          # either (Dependabot bumps the pins in release.yml directly) has
          # to be checked against the other, or the next release refuses.
          echo "$changed" | grep -qE '^(\.github/workflows/release\.yml|dist-workspace\.toml|Cargo\.toml)$' && dist=true
          also "$worker" "$dist"

  check:
    name: fmt · clippy · build · test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Report all platforms, not just whichever fails first — a Windows-only
      # break should not hide a Linux one.
      fail-fast: false
      matrix:
        # Every platform with target-specific code gets built and tested. Before
        # this, only macOS ran, so the Linux parser tests in src/platform/mod.rs
        # were compiled and executed nowhere.
        # ubuntu-24.04-arm is the aarch64 Linux runner: the binary it uploads
        # is the one an ARM64 VM (UTM on Apple silicon, Raspberry Pi) can run.
        # `artifact` names the uploaded binary by architecture and OS, which is
        # what a tester picking one from the run page needs to know.
        # Linux binaries are built for the musl target, statically linked, as
        # the release is: a glibc build from this runner would refuse to start
        # on any distribution with an older glibc (RHEL 8, Ubuntu 20.04…).
        # Tests still run against the native toolchain.
        include:
          - os: macos-latest
            artifact: octomon-arm64-macos
            bin: target/release/octomon
          - os: ubuntu-latest
            artifact: octomon-x86-linux
            target: x86_64-unknown-linux-musl
            bin: target/x86_64-unknown-linux-musl/release/octomon
          - os: ubuntu-24.04-arm
            artifact: octomon-arm64-linux
            target: aarch64-unknown-linux-musl
            bin: target/aarch64-unknown-linux-musl/release/octomon
          - os: windows-latest
            artifact: octomon-x64-windows
            bin: target/release/octomon.exe
          - os: windows-11-arm
            artifact: octomon-arm64-windows
            bin: target/release/octomon.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build below runs third-party build scripts; none of them
          # should find a token in .git/config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # ring builds its C code with clang on Windows AArch64 and errors out
      # without it. Every other runner image already has a usable compiler.
      - name: Install clang (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        run: choco install llvm --no-progress -y

      # The static Linux build: the musl target plus musl-gcc for ring's C.
      # apt on a fresh ubuntu-latest image can sit behind the dpkg lock held
      # by the boot-time unattended-upgrades run — silently, for the whole
      # job — so that is stopped first, the lock is given a bounded wait, and
      # the step as a whole cannot hang the matrix.
      - name: Install musl target (Linux)
        if: matrix.target != ''
        timeout-minutes: 8
        run: |
          rustup target add ${{ matrix.target }}
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          install() { sudo apt-get -o DPkg::Lock::Timeout=240 install -y -q --no-install-recommends musl-tools; }
          install || (sudo apt-get -o DPkg::Lock::Timeout=240 update -q && install)

      # Formatting is platform-independent; checking it four times would only
      # multiply the noise when it fails.
      - name: Format
        if: matrix.os == 'macos-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Test
        run: cargo test

      # A CI runner has no real Wi-Fi radio, no ICMP guarantee and (on Windows)
      # no unprivileged per-process source, so much of the platform-specific
      # code can only be judged by running it on real hardware. Publishing every
      # platform's binary means that can happen without a Rust toolchain on the
      # tester's machine. Release builds come from cargo-dist, not from here.
      - name: Upload binary for manual testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          retention-days: 14
          if-no-files-found: error

  # The Cloudflare Worker behind octomon.dev: plain Node tests with fetch
  # stubbed, nothing reaches Cloudflare. Its own job, so a Worker change
  # does not compile five platforms to prove nothing broke.
  worker:
    name: worker tests
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test worker/

  # release.yml is written by dist from dist-workspace.toml, and dist's own
  # `plan` step on a release refuses to run if the two disagree — which a
  # hand edit, or Dependabot bumping the pinned actions in release.yml,
  # makes them do. Caught here, on the pull request, with the fix in the
  # message: edit dist-workspace.toml and run `dist generate`.
  dist:
    name: release.yml matches dist-workspace.toml
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release pinned in dist-workspace.toml, fetched as a tarball and
      # checked against the digest dist publishes beside it, rather than
      # its `curl | sh` installer. Bump both lines together.
      - name: Install dist 0.32.0
        run: |
          set -euo pipefail
          url=https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-x86_64-unknown-linux-musl.tar.xz
          curl --proto '=https' --tlsv1.2 -sSfL "$url" -o dist.tar.xz
          echo "0d9dc001b0e937e9cc18e0dc11784aa7a3fd566656b07828d5e1d10ce1c1c48c  dist.tar.xz" | sha256sum -c -
          tar -xJf dist.tar.xz --strip-components=1 -C "$HOME/.cargo/bin" cargo-dist-x86_64-unknown-linux-musl/dist
      - run: dist generate --check

  # One stable check for branch protection to require.
  #
  # Matrix jobs carry their OS in the reported context name, so requiring them
  # directly means editing the protection rule every time a platform is added
  # or dropped — and a required context that no job reports blocks merges
  # forever, with no indication of why. This name is fixed and the rule can
  # point at it permanently.
  check-all:
    name: fmt · clippy · build · test
    needs: [changes, check]
    # Run even when a leg fails, so the result is a failure rather than a
    # skipped check that never reports. This is the context branch protection
    # requires, so it has to report on *every* run — including the ones where
    # the matrix was skipped for having nothing to compile.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every platform passed
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "nothing that compiles changed — matrix skipped, passing"
            exit 0
          fi
          echo "matrix result: ${{ needs.check.result }}"
          [ "${{ needs.check.result }}" = "success" ]

  audit:
    name: cargo audit
    needs: changes
    # Dependencies cannot change without a manifest change, and the weekly run
    # covers advisories published against ones that stayed put.
    if: needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
