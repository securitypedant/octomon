# Linux packages for each release: Debian packages built per-arch and rpms
# packaged from the release tarballs, attached to the GitHub release that
# dist created, then published as the signed apt and rpm repositories at
# https://octomon.dev/apt and https://octomon.dev/rpm (one R2 bucket served
# by the octomon.dev worker).
#
# A separate file on purpose: release.yml is generated by dist and would be
# overwritten by the next `dist init`.
#
# Trigger: when the Release workflow finishes. A `release: published` trigger
# would never fire — dist creates the release with the workflow's own
# GITHUB_TOKEN, and token-created events do not start other workflows.
# workflow_dispatch covers manual recovery for an existing tag.
#
# Secrets: APT_SIGNING_KEY (armored private key, signs both repositories),
# CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN (scoped to R2 write on the
# octomon-apt bucket).
#
# Token scope: the deb job compiles every crate in Cargo.lock — their build
# scripts and proc macros run as part of `cargo deb` — so it holds a read-only
# token and no secrets, and builds only a tag that is on main. The rpm job
# compiles nothing (it repackages the release's static binaries, checksummed
# against what dist published) and is read-only too. Only the publish job,
# which runs nothing but apt, rpm, gpg and our own scripts over the built
# artifacts, gets write access to the release and the signing and R2 secrets.
name: Packages
permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish packages for (e.g. v0.7.0)"
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  deb:
    # On workflow_run: only after a successful Release run for a version tag
    # pushed to this repository (its head_branch is the tag name for tag-push
    # runs). Release also runs on pull_request, where only `dist plan`
    # executes and succeeds — so without the event and repository checks a
    # fork PR from a branch named like a tag would start this publish.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # The ref checked out below comes from a workflow_dispatch input on the
      # manual path, so insist that it names a release tag before fetching it.
      # publish needs this job, so the same TAG reaches it checked.
      - name: Check the tag names a release
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # Nothing after the checkout needs the token, and the crates built
          # below should not find one in .git/config.
          persist-credentials: false
          # Full history, for the ancestry check below.
          fetch-depth: 0
      # A release is cut from main, so the code built here must already be
      # on main: `cargo deb` runs every crate's build scripts in the default
      # branch's context (CodeQL: cache poisoning from a dispatched ref), and
      # this keeps that to code the default branch itself carries. Only
      # writers can create tags or dispatch this workflow in the first place.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::'$TAG' is not on main; releases are cut from main"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  rpm:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag names a release
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi
      # The packaging tooling (spec, scripts) comes from the branch this
      # workflow file itself runs from, not from the tag: nothing of the
      # tag's is executed here, only its published tarballs are repackaged,
      # and a release cut before the tooling existed can still be packaged
      # by dispatching for its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm xz-utils
      # The release's own static binaries, so the rpm carries the same bytes
      # as the tarball, Homebrew and the installer script. The checksums dist
      # published beside them are checked before anything is unpacked.
      - name: Fetch the release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir src && cd src
          for t in x86_64 aarch64; do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
              -p "octomon-$t-unknown-linux-musl.tar.xz" \
              -p "octomon-$t-unknown-linux-musl.tar.xz.sha256"
            sha256sum -c "octomon-$t-unknown-linux-musl.tar.xz.sha256"
          done
      - name: Build .rpm
        run: |
          version="${TAG#v}"
          for t in x86_64 aarch64; do
            rpmbuild -bb --target "$t" \
              --define "version $version" \
              --define "_sourcedir $PWD/src" \
              --define "_rpmdir $PWD/rpms" \
              packaging/rpm/octomon.spec
          done
          find rpms -mindepth 2 -name '*.rpm' -exec mv {} rpms/ \;
          ls -l rpms/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: rpms/*.rpm
          if-no-files-found: error

  publish:
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Scripts from the workflow's own branch, as in the rpm job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm
          path: rpms
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" debs/*.deb rpms/*.rpm --clobber
      - name: Install repo tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils rpm createrepo-c
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Build the repository trees
        run: |
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          ./.github/scripts/build-apt-repo.sh debs repo/apt "$KEYID"
          # The public key beside the repo, so the install instructions'
          # first line always matches the key that signed InRelease.
          gpg --export "$KEYID" > repo/apt/octomon.gpg
          ./.github/scripts/build-rpm-repo.sh rpms repo/rpm "$KEYID"
          find repo -type f | sort
      - name: Upload to R2 (S3 API)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Deliberately NOT `wrangler r2 object put`: wrangler talks to the
          # Cloudflare REST API, which a bucket-scoped "Bucket Item Write"
          # token cannot use (403) — that permission class only works with the
          # S3-compatible API. The S3 credentials derive from the token
          # itself: access key id = the token's id, secret = SHA-256 of the
          # token value (developers.cloudflare.com/r2/api/tokens), so the
          # least-privilege token stays and no extra secrets are needed.
          TOKEN_ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            | jq -r '.result.id // empty')
          if [ -z "$TOKEN_ID" ]; then
            # A user-owned (not account-owned) token verifies here instead.
            TOKEN_ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              | jq -r '.result.id // empty')
          fi
          test -n "$TOKEN_ID" || { echo "could not resolve the API token id"; exit 1; }
          export AWS_ACCESS_KEY_ID="$TOKEN_ID"
          export AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          export AWS_DEFAULT_REGION=auto
          # repo/apt → apt/, repo/rpm → rpm/ in the bucket: the worker maps
          # /apt/* and /rpm/* onto those prefixes.
          aws s3 sync repo "s3://octomon-apt" --no-progress \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
