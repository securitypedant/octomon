# Debian packages for each release: built per-arch, attached to the GitHub
# release that dist created, then published as the signed apt repository at
# https://octomon.dev/apt (an R2 bucket served by the octomon.dev worker).
#
# A separate file on purpose: release.yml is generated by dist and would be
# overwritten by the next `dist init`.
#
# Trigger: when the Release workflow finishes. A `release: published` trigger
# would never fire — dist creates the release with the workflow's own
# GITHUB_TOKEN, and token-created events do not start other workflows.
# workflow_dispatch covers manual recovery for an existing tag.
#
# Secrets: APT_SIGNING_KEY (armored private key), CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_API_TOKEN (scoped to R2 write on the octomon-apt bucket).
name: Deb
permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish .debs for (e.g. v0.7.0)"
        required: true

jobs:
  deb:
    # On workflow_run: only after a successful Release run for a version tag
    # (its head_branch is the tag name for tag-push runs).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" target/debian/*.deb --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  publish-apt:
    needs: deb
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - name: Install repo tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Build the repository tree
        run: |
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          ./.github/scripts/build-apt-repo.sh debs repo "$KEYID"
          # The public key beside the repo, so the install instructions'
          # first line always matches the key that signed InRelease.
          gpg --export "$KEYID" > repo/octomon.gpg
          find repo -type f | sort
      - name: Upload to R2 (S3 API)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Deliberately NOT `wrangler r2 object put`: wrangler talks to the
          # Cloudflare REST API, which a bucket-scoped "Bucket Item Write"
          # token cannot use (403) — that permission class only works with the
          # S3-compatible API. The S3 credentials derive from the token
          # itself: access key id = the token's id, secret = SHA-256 of the
          # token value (developers.cloudflare.com/r2/api/tokens), so the
          # least-privilege token stays and no extra secrets are needed.
          TOKEN_ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            | jq -r '.result.id // empty')
          if [ -z "$TOKEN_ID" ]; then
            # A user-owned (not account-owned) token verifies here instead.
            TOKEN_ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              | jq -r '.result.id // empty')
          fi
          test -n "$TOKEN_ID" || { echo "could not resolve the API token id"; exit 1; }
          export AWS_ACCESS_KEY_ID="$TOKEN_ID"
          export AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          export AWS_DEFAULT_REGION=auto
          aws s3 sync repo "s3://octomon-apt/apt" --no-progress \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
