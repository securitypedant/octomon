# The AUR package octomon-bin, updated on each release: the PKGBUILD is
# rendered from packaging/aur/PKGBUILD.in with the release's version and the
# checksums dist published, and pushed to aur.archlinux.org.
#
# Same trigger shape as packages.yml, for the same reason: a `release:
# published` trigger would never fire for a release dist created with the
# workflow's own token.
#
# Secrets: AUR_SSH_PRIVATE_KEY (an SSH key registered on the AUR account),
# AUR_USERNAME and AUR_EMAIL (the commit identity on the AUR git repo).
# Without them the job reports that it skipped, so a release without an AUR
# account configured still succeeds.
name: AUR
permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the AUR (e.g. v0.12.1)"
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  aur:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag names a release
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::'$TAG' is not on main; releases are cut from main"
            exit 1
          fi
      # Secrets cannot be read in a job-level `if`, so the gate is a step.
      - name: Check the AUR credentials are configured
        id: creds
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; octomon-bin not updated for $TAG"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Render the PKGBUILD
        if: steps.creds.outputs.ready == 'true'
        run: |
          ./packaging/aur/render.sh "${TAG#v}" out
          cat out/PKGBUILD
      # Pinned to a commit: this action receives the SSH key and pushes as
      # us, and runs makepkg --printsrcinfo in an Arch container to produce
      # the .SRCINFO the AUR requires.
      - name: Publish to the AUR
        if: steps.creds.outputs.ready == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: octomon-bin
          pkgbuild: out/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.TAG }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
