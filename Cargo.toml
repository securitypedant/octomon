[package]
name = "octomon"
version = "0.9.7"
edition = "2024"
description = "Btop-style terminal network monitor: latency, bandwidth, and Wi-Fi signal"
repository = "https://github.com/securitypedant/octomon"
homepage = "https://github.com/securitypedant/octomon"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["network", "monitoring", "tui", "bandwidth", "latency"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.88"
# An allowlist rather than `exclude`: anything added to the repo later stays out
# of the crate unless it is deliberately let in. Cargo.toml and Cargo.lock are
# always included. Keeps CI config, release tooling and the 429K screenshot —
# which crates.io cannot render anyway — out of what users download.
include = [
    "src/**/*.rs",
    "build.rs",
    "README.md",
    "PRIVILEGES.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "SECURITY.md",
]

[build-dependencies]
# Same crate the binary already uses — only for the dirty-build timestamp.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.33"
netdev = "0.46.0"
ratatui = "0.30.2"
# Both root stores: Mozilla's bundled set, and the OS store — which is where a
# corporate / Zero-Trust TLS-inspection root (Cloudflare WARP with Gateway,
# Zscaler…) lives. With only the bundle, every HTTPS check fails behind such a
# proxy while the browser, trusting the OS store, is fine.
# The `-no-provider` variants keep reqwest from wiring in ring; the crypto
# provider is the `rustls` dependency below, installed in main().
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "rustls-tls-native-roots-no-provider", "stream", "http2"] }
# aws-lc-rs rather than ring: Cloudflare Gateway's TLS-inspection intermediate
# signs with ECDSA-SHA256 under a P-384 key, a mixed combination ring refuses
# (ring pairs each curve with one hash) — so behind WARP every HTTPS check died
# with UnsupportedSignatureAlgorithmForPublicKeyContext. aws-lc-rs accepts it.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
surge-ping = "0.9.0"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# tools::is_privileged(), and the DF-bit socket options of the path-MTU probe.
libc = "0.2"
# The path-MTU probe's ICMP socket (already in the tree via tokio/surge-ping).
socket2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-wlan = "0.3.2"
objc2-foundation = "0.3.2"

# Already in the dependency graph via mio/netdev/dirs-sys, so this selects
# features rather than adding a crate. Preferred over the `windows` crate: no COM
# machinery, and its crate name is `windows_sys`, which leaves the name `windows`
# free for our own `platform::windows` module.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Time",
] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# `cargo deb` (.github/workflows/deb.yml) — Debian packages attached to each
# GitHub release, and the input to the apt repository.
[package.metadata.deb]
maintainer = "Simon Thorpe <simsecpedant@gmail.com>"
copyright = "2025-2026, Simon Thorpe"
section = "net"
priority = "optional"
depends = "$auto"
# Powers startup path discovery and the [m] hop monitor; everything else
# works without it.
recommends = "traceroute"
extended-description = """\
A btop-style terminal dashboard for network health: per-target latency, loss \
and jitter, per-process and per-remote bandwidth, Wi-Fi signal, DNS resolver \
health, and a triage engine that names the failing layer (gateway, ISP path, \
DNS, wide internet) instead of leaving graphs to interpret."""
assets = [
    ["target/release/octomon", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/octomon/", "644"],
    ["PRIVILEGES.md", "usr/share/doc/octomon/", "644"],
]
