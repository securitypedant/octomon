[package]
name = "octomon"
version = "0.3.0-rc.1"
edition = "2024"
description = "Btop-style terminal network monitor: latency, bandwidth, and Wi-Fi signal"
repository = "https://github.com/securitypedant/octomon"
homepage = "https://github.com/securitypedant/octomon"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["network", "monitoring", "tui", "bandwidth", "latency"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.88"
# An allowlist rather than `exclude`: anything added to the repo later stays out
# of the crate unless it is deliberately let in. Cargo.toml and Cargo.lock are
# always included. Keeps CI config, release tooling and the 429K screenshot —
# which crates.io cannot render anyway — out of what users download.
include = [
    "src/**/*.rs",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "SECURITY.md",
]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.33"
netdev = "0.46.0"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
surge-ping = "0.9.0"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-wlan = "0.3.2"
objc2-foundation = "0.3.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
