<svg xmlns="http://www.w3.org/2000/svg" viewBox="1140 50 1260 900" font-family="ui-monospace, Menlo, Consolas, monospace">
  <!-- Hero art: four mock panels around the octomon mark, transparent
       background (the page supplies the glow). All colours are the brand
       tokens from tokens.css, hard-coded because SVG-as-image can't read
       CSS variables from the page. -->
  <defs>
    <radialGradient id="gBadge" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#B249B9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B249B9" stop-opacity="0"/>
    </radialGradient>
    <path id="arm" d="M1849 401 C1885 365 1905 355 1922 332 C1934 315 1924 298 1907 302"
          fill="none" stroke="#3FCF5C" stroke-width="9" stroke-linecap="round"/>
  </defs>

  <!-- ── panel: Connection Quality (top-left) ── -->
  <g>
    <rect x="1180" y="90" width="550" height="390" rx="16" fill="#0B0D11" fill-opacity="0.92" stroke="#343C46" stroke-width="2"/>
    <text x="1204" y="132" font-size="24" font-weight="700" fill="#3FCF5C">Connection Quality</text>
    <g font-size="16" fill="#8A96A4">
      <text x="1204" y="172">target</text>
      <text x="1620" y="172" text-anchor="end">last</text>
      <text x="1700" y="172" text-anchor="end">loss</text>
    </g>
    <g font-size="19">
      <text x="1204" y="206" fill="#F4F7FA">Google</text>
      <text x="1620" y="206" text-anchor="end" fill="#3FCF5C">6.3ms</text>
      <text x="1700" y="206" text-anchor="end" fill="#3FCF5C">1%</text>
      <text x="1204" y="240" fill="#F4F7FA">gateway</text>
      <text x="1620" y="240" text-anchor="end" fill="#3FCF5C">4.9ms</text>
      <text x="1700" y="240" text-anchor="end" fill="#3FCF5C">0%</text>
      <text x="1204" y="274" fill="#F4F7FA">hop 2</text>
      <text x="1620" y="274" text-anchor="end" fill="#E8B03A">20.3ms</text>
      <text x="1700" y="274" text-anchor="end" fill="#E8B03A">3%</text>
      <text x="1204" y="308" fill="#F4F7FA">bbc.co.uk</text>
      <text x="1620" y="308" text-anchor="end" fill="#3FCF5C">7.5ms</text>
      <text x="1700" y="308" text-anchor="end" fill="#3FCF5C">1%</text>
    </g>
    <!-- latency histogram -->
    <g fill="#3FCF5C" fill-opacity="0.85">
      <rect x="1204" y="432" width="9" height="12"/>
      <rect x="1219" y="426" width="9" height="18"/>
      <rect x="1234" y="434" width="9" height="10"/>
      <rect x="1249" y="422" width="9" height="22"/>
      <rect x="1264" y="428" width="9" height="16"/>
      <rect x="1279" y="416" width="9" height="28"/>
      <rect x="1294" y="430" width="9" height="14"/>
      <rect x="1309" y="424" width="9" height="20"/>
      <rect x="1324" y="410" width="9" height="34" fill="#E8B03A"/>
      <rect x="1339" y="426" width="9" height="18"/>
      <rect x="1354" y="432" width="9" height="12"/>
      <rect x="1369" y="418" width="9" height="26"/>
      <rect x="1384" y="404" width="9" height="40" fill="#E8B03A"/>
      <rect x="1399" y="422" width="9" height="22"/>
      <rect x="1414" y="428" width="9" height="16"/>
      <rect x="1429" y="414" width="9" height="30"/>
      <rect x="1444" y="432" width="9" height="12"/>
      <rect x="1459" y="426" width="9" height="18"/>
      <rect x="1474" y="420" width="9" height="24"/>
      <rect x="1489" y="430" width="9" height="14"/>
      <rect x="1504" y="408" width="9" height="36" fill="#E8B03A"/>
      <rect x="1519" y="424" width="9" height="20"/>
      <rect x="1534" y="428" width="9" height="16"/>
      <rect x="1549" y="434" width="9" height="10"/>
    </g>
  </g>

  <!-- ── panel: Bandwidth (top-right) ── -->
  <g>
    <rect x="1770" y="90" width="550" height="390" rx="16" fill="#0B0D11" fill-opacity="0.92" stroke="#343C46" stroke-width="2"/>
    <text x="2296" y="132" font-size="24" font-weight="700" fill="#3FCF5C" text-anchor="end">Bandwidth</text>
    <text x="2160" y="176" font-size="20" fill="#3FCF5C" text-anchor="end">&#8595; 842 Mbps</text>
    <text x="2296" y="176" font-size="20" fill="#B249B9" text-anchor="end">&#8593; 41 Mbps</text>
    <!-- download area + line -->
    <path d="M1794 440 L1794 372 C1830 330 1860 360 1890 340 C1920 320 1950 250 1990 262 C2030 274 2050 330 2090 322 C2130 314 2150 240 2190 252 C2230 264 2270 320 2296 300 L2296 440 Z"
          fill="#3FCF5C" fill-opacity="0.20"/>
    <path d="M1794 372 C1830 330 1860 360 1890 340 C1920 320 1950 250 1990 262 C2030 274 2050 330 2090 322 C2130 314 2150 240 2190 252 C2230 264 2270 320 2296 300"
          fill="none" stroke="#3FCF5C" stroke-width="3"/>
    <!-- upload area + line -->
    <path d="M1794 440 L1794 425 C1850 415 1900 428 1950 420 C2000 412 2050 430 2100 418 C2150 406 2230 428 2296 415 L2296 440 Z"
          fill="#B249B9" fill-opacity="0.30"/>
    <path d="M1794 425 C1850 415 1900 428 1950 420 C2000 412 2050 430 2100 418 C2150 406 2230 428 2296 415"
          fill="none" stroke="#B249B9" stroke-width="2.5"/>
  </g>

  <!-- ── panel: Network (bottom-left) ── -->
  <g>
    <rect x="1180" y="520" width="550" height="390" rx="16" fill="#0B0D11" fill-opacity="0.92" stroke="#343C46" stroke-width="2"/>
    <text x="1204" y="562" font-size="24" font-weight="700" fill="#3FCF5C">Network</text>
    <g font-size="19">
      <text x="1204" y="604" fill="#8A96A4">wi-fi</text>
      <text x="1330" y="604" fill="#F4F7FA">HomeNet &#183; 5 GHz</text>
      <text x="1204" y="638" fill="#8A96A4">gateway</text>
      <text x="1330" y="638" fill="#F4F7FA">192.168.0.1</text>
      <text x="1204" y="672" fill="#8A96A4">dns</text>
      <text x="1330" y="672" fill="#3FCF5C">9.9.9.9 &#183; 12 ms</text>
      <text x="1204" y="706" fill="#8A96A4">public</text>
      <text x="1330" y="706" fill="#F4F7FA">203.0.113.49</text>
    </g>
    <!-- signal bars -->
    <text x="1204" y="792" font-size="16" fill="#8A96A4">signal &#8722;52 dBm</text>
    <g fill="#3FCF5C">
      <rect x="1204" y="836" width="14" height="14" rx="3"/>
      <rect x="1226" y="826" width="14" height="24" rx="3"/>
      <rect x="1248" y="816" width="14" height="34" rx="3"/>
      <rect x="1270" y="806" width="14" height="44" rx="3"/>
      <rect x="1292" y="796" width="14" height="54" rx="3" fill="#343C46"/>
    </g>
    <polyline points="1350,824 1380,820 1410,828 1440,818 1470,826 1500,816 1530,824 1560,814 1590,820 1620,812 1650,818"
              fill="none" stroke="#3FCF5C" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- ── panel: Machine (bottom-right) ── -->
  <g>
    <rect x="1770" y="520" width="550" height="390" rx="16" fill="#0B0D11" fill-opacity="0.92" stroke="#343C46" stroke-width="2"/>
    <text x="2296" y="562" font-size="24" font-weight="700" fill="#3FCF5C" text-anchor="end">Machine</text>
    <text x="1794" y="726" font-size="16" fill="#8A96A4">cpu &#183; per core</text>
    <g fill="#3FCF5C" fill-opacity="0.85">
      <rect x="1794" y="806" width="18" height="60" rx="3"/>
      <rect x="1824" y="771" width="18" height="95" rx="3"/>
      <rect x="1854" y="821" width="18" height="45" rx="3"/>
      <rect x="1884" y="746" width="18" height="120" rx="3"/>
      <rect x="1914" y="796" width="18" height="70" rx="3"/>
      <rect x="1944" y="716" width="18" height="150" rx="3" fill="#E8B03A"/>
      <rect x="1974" y="811" width="18" height="55" rx="3"/>
      <rect x="2004" y="781" width="18" height="85" rx="3"/>
      <rect x="2034" y="756" width="18" height="110" rx="3"/>
      <rect x="2064" y="801" width="18" height="65" rx="3"/>
    </g>
    <text x="2140" y="778" font-size="17" fill="#8A96A4">mem 62%</text>
    <rect x="2140" y="790" width="160" height="16" rx="8" fill="#343C46"/>
    <rect x="2140" y="790" width="99" height="16" rx="8" fill="#3FCF5C"/>
    <text x="2140" y="856" font-size="17" fill="#8A96A4">load 1.8</text>
  </g>

  <!-- ── arms reaching from the centre into each panel ── -->
  <g opacity="0.7">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(90 1750 500)"/>
    <use href="#arm" transform="rotate(180 1750 500)"/>
    <use href="#arm" transform="rotate(270 1750 500)"/>
  </g>

  <!-- ── the octomon, centre badge ── -->
  <circle cx="1750" cy="500" r="215" fill="url(#gBadge)"/>
  <circle cx="1750" cy="500" r="165" fill="#15181D" stroke="#B249B9" stroke-width="3.5"/>
  <!-- octomon-brand/logo/octomon-logo.svg, scaled into the badge -->
  <g transform="translate(1628.4 370.8) scale(1.9)">
    <g fill="#3FCF5C">
      <g transform="rotate(-14 22 64)"><rect x="18" y="60" width="8" height="44" rx="4"/></g>
      <g transform="rotate(-7 34 64)"><rect x="30" y="60" width="8" height="58" rx="4"/></g>
      <rect x="42" y="60" width="8" height="40" rx="4"/>
      <rect x="54" y="60" width="8" height="54" rx="4"/>
      <rect x="66" y="60" width="8" height="42" rx="4"/>
      <rect x="78" y="60" width="8" height="58" rx="4" fill="#E8B03A"/>
      <g transform="rotate(7 94 64)"><rect x="90" y="60" width="8" height="46" rx="4"/></g>
      <g transform="rotate(14 106 64)"><rect x="102" y="60" width="8" height="60" rx="4"/></g>
    </g>
    <path d="M22 70 C22 42 38 18 64 18 C90 18 106 42 106 70 Z" fill="#3FCF5C"/>
    <rect x="44" y="38" width="11" height="18" rx="1.5" fill="#E0524D"/>
    <rect x="73" y="38" width="11" height="18" rx="1.5" fill="#E0524D"/>
  </g>
</svg>
