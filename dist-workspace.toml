[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap to publish the (binary) formula into
tap = "securitypedant/homebrew-octomon"
publish-jobs = ["homebrew"]
# Target platforms to build apps for. Linux uses musl so the binaries are
# statically linked: no glibc-version skew, so one build runs anywhere from
# Alpine to RHEL. x86 macOS builds cleanly but is unverified on Intel hardware
# (add once smoke-tested).
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# After the GitHub release exists: make the PowerShell installer verify the
# archives it downloads (dist's shell installer does, its PowerShell one
# does not). See .github/workflows/windows-installer.yml.
post-announce-jobs = ["./windows-installer"]

# Build ARM64 Windows on ARM64 hardware. ring compiles its C with clang on
# Windows AArch64 and fails without it, which is easier to satisfy on a native
# runner than through a cross-compile from the x64 image. Kept last: a TOML
# sub-table swallows every key that follows it.
# Extra steps for dist's build job; see the file for why.
# Path is relative to .github/workflows/. Kept outside that directory so
# GitHub does not try to run this fragment as a workflow in its own right.
github-build-setup = "../build-setup.yml"
# SHA-pin release.yml's actions (dist writes each value verbatim after `@`).
# Bump here and run `dist generate`; never hand-edit release.yml.
github-action-commits = { "actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2" }

[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-11-arm"
